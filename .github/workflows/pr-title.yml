name: PR title

# PRs are squash-merged, so the PR title becomes the commit on main that
# release-please reads. A title that is not a Conventional Commit would be left
# out of the changelog, and would not bump any version.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          # Optional, but when given it names the package: feat(sdk): ...
          scopes: |
            server
            sdk
            contracts
            web
            git-assist
            deps
            release
